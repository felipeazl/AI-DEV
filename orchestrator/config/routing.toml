# Orchestrator decision rules (flow v3, 2026-10-23).
#
# [rules]   state returned by the agent → next action (deterministic).
# [effort]  no demand levels: each agent runs on the default model and effort of aidw.config.toml. The variants
#           below are the only exceptions, each with the reason that allows it.
#
# Each agent ends with `"state": "<state>"` using the keys of [rules] (see the OUTPUT of each AGENT.md); the
# orchestrator applies the rule. Agents do not choose the next action.
#
# Escalation (claude.dev, "Which Claude model should you build with?", 2026-11): when a result is not good enough,
# first make the agent verify its own work (build, test), then raise the effort one level, then move to the next
# model up starting at a LOWER effort. Never past `high`: one more level costs about as much as the bigger model.
#
# Context: contexts/<name>/routing.toml, when it exists, goes on top of this file (tables merge, values
# replace).

[rules]
# Understand and plan
existing_work_found = "HUMAN_APPROVAL"          # Tasks, PR or branch already exist: continuation, fix or redo?
exploration_complete = "RETURN"                 # the explorer goes back to the step that called it
plan_needs_exploration = "EXPLORE"              # the planner needs code it does not know
plan_has_open_questions = "HUMAN_APPROVAL"      # a real doubt or more than one valid path
plan_ready = "PLAN_APPROVAL"                    # the orchestrator reads the plan and the user approves; adjustment → PLAN_FIX

# Implementation (coder). With the plan approved, the orchestrator starts in parallel the coder, the qa (test script
# and data) and the documenter (README and Tasks on the board).
implementation_complete = "REVIEW"
implementation_failed = "CODER_FIX"
implementation_has_open_questions = "HUMAN_APPROVAL"  # the plan does not fit the code; check it first
environment_blocked = "HUMAN_APPROVAL"          # only when the orchestrator cannot solve it

# Review (reviewer: quality, bugs and security in one pass)
review_findings = "TRIAGE"                      # the findings go to the user and the orchestrator; kept → CODER_FIX
review_approved = "USER_REVIEW"                 # no finding to decide: the user's code review

# Tests (qa)
test_plan_ready = "RETURN"                      # test script and data ready, in parallel with the coder
test_plan_has_open_questions = "HUMAN_APPROVAL" # a criterion with no way to prove it, or a real doubt
test_adjustment_needed = "TEST_ADJUST"          # the script needs a temporary bypass/flag: coder
tests_passed = "PR"                             # everything proven, no manual step pending
manual_test_required = "MANUAL_TEST"            # automatic steps OK; the user runs the manual steps with the orchestrator
tests_failed = "CODER_FIX"                      # review of only the fix and retest of only the affected steps

# Board, PR and end (documenter)
task_complete = "RETURN"                        # README attached and Tasks created on the board
pr_ready = "PR"                                 # pr-<id>.md ready: with the user's OK, commit, push and PR
pr_review_done = "FINAL_REVIEW"                 # someone else's PR: the user chooses what to publish
final_review_approved = "DONE"
policy_requires_approval = "HUMAN_APPROVAL"     # locked action (commit, push, write SQL...)

# ---------------------------------------------------------------------------------------------
# Effort: exceptions to each agent's default (aidw.config.toml). Each one becomes a variant with its model and
# effort pinned (a Claude subagent `<name>-<effort>`, a Codex role `aidw-<name>-<effort>`), spawned by name, and is
# valid only for the reason in its `when`. Without `model`, it is the
# agent's; a model of another provider becomes the equivalent by tier (opus → top, sonnet → mid, haiku → fast).

[[effort.variants.planner]]
effort = "medium"
when = "plan adjustment the user asked for at approval"

[[effort.variants.explorer]]
model = "sonnet"
effort = "medium"
when = "redo once when the default's result made no sense (say why)"

[[effort.variants.explorer]]
model = "sonnet"
effort = "high"
when = "survey: the end-to-end flow map is the deliverable"

[[effort.variants.coder]]
effort = "medium"
when = "small fix (kept finding, failed test, user adjustment) or temporary test adjustment"

[[effort.variants.coder]]
model = "opus"
effort = "medium"
when = "delivery the plan marks as complex (migration, concurrency, performance, contract between systems), or a fix that failed twice (say which)"

[[effort.variants.reviewer]]
effort = "medium"
when = "re-review of only the fixes"

[[effort.variants.reviewer]]
effort = "low"
when = "re-review of a trivial fix (text, one line, rename)"

[[effort.variants.qa]]
effort = "high"
when = "redo once when the result made no sense (say why)"
