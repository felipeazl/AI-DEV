# Regras de decisão do orquestrador.
#
# [rules]  estado devolvido pelo agente → próxima ação (determinístico).
# [effort] quanto raciocínio cada tarefa merece. O orquestrador escolhe o effort de CADA
#          delegação (`aidw.py delegate --effort`), com o nível da tarefa e as regras abaixo.
#          O modelo de cada agente é fixo (aidw.config.toml); só muda se o usuário pedir ou
#          se o nível tiver [effort.levels.<nível>.models] (papel → chave de config/models.toml).
#
# Cada agente termina com `"state": "<estado>"` usando as chaves de [rules] (veja o OUTPUT de
# cada AGENT.md); o orquestrador aplica a regra. Agentes não escolhem a próxima ação.

max_retries = 3

[rules]
# Início e plano (planejador; o orquestrador quando ele está desabilitado)
existing_work_found = "HUMAN_APPROVAL"          # continuação, correção ou retrabalho?
plan_has_open_questions = "HUMAN_APPROVAL"      # dúvida real ou mais de um caminho válido
plan_needs_exploration = "EXPLORE"              # o planejador precisa de código que não conhece: explorador, e
                                                # um planejador novo no mesmo modo (conta em max_retries)
spec_ready = "TEST_PLAN"                        # sem dúvidas: o qa monta o plano de testes (qa desabilitado: PLAN_REVIEW)
test_plan_ready = "PLAN_REVIEW"                 # revisor confere o plano e o plano de testes (padrao+)
test_plan_has_open_questions = "HUMAN_APPROVAL" # critério sem cenário verificável ou dúvida real
plan_review_approved = "TICKETS"
plan_review_changes_requested = "PLAN_FIX"      # o orquestrador corrige o plano; nova rodada
plan_review_has_open_questions = "HUMAN_APPROVAL"
tickets_ready = "IMPLEMENT"

# Implementação (codificador)
implementation_complete = "TEST"
implementation_failed = "CODER_FIX"
environment_blocked = "HUMAN_APPROVAL"          # só quando o orquestrador não consegue resolver
ticket_has_open_questions = "HUMAN_APPROVAL"    # o plano não serve para o código; confira antes

# Testes (qa, modo test). Com o qa desabilitado, TEST = conferir o bloco `validation` do codificador.
tests_failed = "CODER_FIX"
tests_passed = "PREPARE_REVIEW"
manual_test_required = "PREPARE_REVIEW"         # parte automática OK; o roteiro roda com o usuário depois da revisão
test_adjustment_needed = "TEST_ADJUST"          # codificador aplica o ajuste temporário; um qa novo continua
orchestrator_test_needed = "ORCHESTRATOR_TEST"  # o qa não tinha navegador: o orquestrador testa e o qa confere

# Ciclo de revisão (triagem por regras)
review_ready = "REVIEW"
review_changes_requested = "CODER_FIX"          # CRITICO/IMPORTANTE pendentes
review_has_open_questions = "HUMAN_APPROVAL"    # só as dúvidas; o resto do ciclo segue
review_approved = "MANUAL_TEST"                 # roteiro manual pendente → usuário testa; sem roteiro → DOCS
pr_review_done = "FINAL_REVIEW"                 # PR de outra pessoa: triagem e o usuário escolhe o que publicar
max_retries_exceeded = "HUMAN_APPROVAL"

# Agentes de apoio (api, explorador): devolvem o fluxo para a etapa que os chamou
task_complete = "RETURN"
exploration_complete = "RETURN"

# Especialistas sob demanda (bugs, seguranca): voltam para a etapa que os chamou. Os achados
# entram na mesma triagem da revisão (CRITICO/IMPORTANTE → CODER_FIX ou PLAN_FIX).
audit_clean = "RETURN"
audit_findings = "RETURN"
audit_has_open_questions = "HUMAN_APPROVAL"

# Fim
docs_complete = "FINAL_REVIEW"
final_review_approved = "DONE"
policy_requires_approval = "HUMAN_APPROVAL"     # ação travada (commit, push, SQL de escrita...)

# ---------------------------------------------------------------------------------------------
# Effort por tarefa.
#
# O orquestrador classifica cada tarefa num nível e passa o effort daquele nível para o papel
# que vai executá-la. Papel ausente num nível = o effort padrão do agente (aidw.config.toml).
# Valores: low | medium | high | xhigh | max, ou "none" (o papel não roda no nível). Modelos sem effort
# (ex.: Haiku) ignoram o valor, que continua valendo para o equivalente do Codex.
# [effort.levels.<nível>.models]: papel → modelo do Claude; no Codex vale o equivalente pelo tier
# (opus → top, sonnet → mid, haiku → fast), então a mesma tabela serve aos dois.
#
# Custo: effort é a principal alavanca de gasto depois do modelo. Na dúvida entre dois níveis,
# escolha o menor e suba se o resultado mostrar que faltou (regras em [effort.escalate]).

[effort]
default_level = "padrao"

[effort.levels.trivial]
when = "Leitura ou consulta sem decisão: levantar arquivos e trechos, descobrir um id, gerar um dado de teste por receita pronta, resumir um documento, ajuste de texto."
# Trivial não tem plano. Código e revisão em Sonnet high; api no Haiku.
planner = "none"
explorer = "low"
coder = "high"
reviewer = "high"
api-db = "low"
documenter = "low"
qa = "low"
bug-hunter = "low"
security = "low"

[effort.levels.trivial.models]
coder = "sonnet"
reviewer = "sonnet"
api-db = "haiku"

[effort.levels.simples]
when = "Mudança pontual de baixo risco: 1–2 arquivos, lógica direta, sem contrato entre sistemas, banco, concorrência/UI thread, laços/polling ou segurança."
# Planejador, codificador e revisor em Sonnet high; api em Sonnet low (monta SQL/chamadas que o Felipe aprova).
planner = "high"
explorer = "low"
coder = "high"
reviewer = "high"
api-db = "low"
documenter = "low"
qa = "low"
bug-hunter = "medium"
security = "medium"

[effort.levels.simples.models]
planner = "sonnet"
coder = "sonnet"
reviewer = "sonnet"

[effort.levels.padrao]
when = "O caso comum: feature ou bug num sistema, alguns arquivos, regra de negócio."
# O caso comum: os modelos base, Opus medium no planejador, codificador e revisor.
planner = "medium"
explorer = "low"
coder = "medium"
reviewer = "medium"
api-db = "medium"
documenter = "medium"
qa = "medium"
bug-hunter = "high"
security = "high"

[effort.levels.complexa]
when = "Vários sistemas ou contrato entre eles, concorrência/UI thread, polling/timers, script de banco, segurança, legado frágil, ou a revisão anterior achou CRITICO."
# Explorador e documentador sobem para Sonnet; bugs e segurança para Opus. Nada acima de high (preserva a sessão).
planner = "high"
explorer = "medium"
coder = "high"
reviewer = "high"
api-db = "high"
documenter = "medium"
qa = "high"
bug-hunter = "high"
security = "high"

[effort.levels.complexa.models]
explorer = "sonnet"
documenter = "sonnet"
bug-hunter = "opus"
security = "opus"

[effort.levels.critica]
when = "Excepcional: falhou duas vezes no nível complexa, correção de segurança/produção, ou migração de dados irreversível. Use raramente e diga o porquê."
# Igual à complexa, com o explorador em Sonnet high. Nada acima de high.
planner = "high"
explorer = "high"
coder = "high"
reviewer = "high"
api-db = "high"
documenter = "medium"
qa = "high"
bug-hunter = "high"
security = "high"

[effort.levels.critica.models]
explorer = "sonnet"
documenter = "sonnet"
bug-hunter = "opus"
security = "opus"

[effort.escalate]
# Quando subir um nível na próxima tentativa do mesmo papel.
rules = [
    "o agente falhou duas vezes na mesma etapa",
    "a revisão achou CRITICO",
    "o resultado mostra que a tarefa é mais difícil do que o nível classificado",
]
# Quando descer: tarefas de acompanhamento (re-revisão só das correções, rodar build de novo,
# responder uma dúvida pontual) usam um nível abaixo do da demanda.
downgrade = "re-revisão só das correções, rodada de build/teste, pergunta pontual"
