# Regras de decisão do orquestrador (fluxo v3, 2026-10-23).
#
# [rules]   estado devolvido pelo agente → próxima ação (determinístico).
# [effort]  sem níveis de demanda: cada agente roda no modelo e no effort padrão do aidw.config.toml. As variantes
#           abaixo são as únicas exceções, cada uma com o motivo que a permite.
#
# Cada agente termina com `"state": "<estado>"` usando as chaves de [rules] (veja o OUTPUT de cada AGENT.md); o
# orquestrador aplica a regra. Agentes não escolhem a próxima ação.
#
# Contexto: contexts/<nome>/routing.toml, quando existe, vai por cima deste arquivo (tabelas se fundem, valores
# substituem).

max_retries = 3          # revisar ⇄ corrigir e explorar ⇄ planejar; no caminho curto, por item (demand set --loop)

[rules]
# Entender e plano
existing_work_found = "HUMAN_APPROVAL"          # Tasks, PR ou branch já existem: continuação, correção ou retrabalho?
exploration_complete = "RETURN"                 # o explorador volta para a etapa que o chamou
plan_needs_exploration = "EXPLORE"              # o planejador precisa de código que não conhece (conta em max_retries)
plan_has_open_questions = "HUMAN_APPROVAL"      # dúvida real ou mais de um caminho válido
plan_ready = "PLAN_APPROVAL"                    # o orquestrador lê o plano e o usuário aprova; ajuste → PLAN_FIX

# Implementação (codificador). Com o plano aprovado, o orquestrador dispara em paralelo o codificador, o qa (roteiro e
# massa) e o documentador (Tasks no board).
implementation_complete = "REVIEW"
implementation_failed = "CODER_FIX"
implementation_has_open_questions = "HUMAN_APPROVAL"  # o plano não serve para o código; confira antes
environment_blocked = "HUMAN_APPROVAL"          # só quando o orquestrador não consegue resolver

# Revisão (revisor: qualidade, bugs e segurança numa passada)
review_findings = "TRIAGE"                      # os achados vão ao usuário e ao orquestrador; mantidos → CODER_FIX
review_approved = "USER_REVIEW"                 # nenhum achado a decidir: a revisão de código do usuário
max_retries_exceeded = "HUMAN_APPROVAL"

# Testes (qa)
test_plan_ready = "RETURN"                      # roteiro e massa prontos, em paralelo com o codificador
test_plan_has_open_questions = "HUMAN_APPROVAL" # critério sem como provar, ou dúvida real
test_adjustment_needed = "TEST_ADJUST"          # o roteiro precisa de um bypass/flag temporário: codificador
tests_passed = "PR"                             # tudo provado, sem passo manual pendente
manual_test_required = "MANUAL_TEST"            # automáticos OK; os passos manuais o usuário roda com o orquestrador
tests_failed = "CODER_FIX"                      # revisão só da correção e reteste só dos passos afetados

# Board, PR e fim (documentador)
task_complete = "RETURN"                        # Tasks criadas no board
pr_ready = "PR"                                 # pr-<id>.md pronto: com o OK do usuário, commit, push e PR
pr_review_done = "FINAL_REVIEW"                 # PR de outra pessoa: o usuário escolhe o que publicar
final_review_approved = "DONE"
policy_requires_approval = "HUMAN_APPROVAL"     # ação travada (commit, push, SQL de escrita...)

# ---------------------------------------------------------------------------------------------
# Effort: exceções ao padrão de cada agente (aidw.config.toml). Cada uma vira uma variante (`subagent_type` no
# Claude, o effort/modelo a passar no Codex) e só vale pelo motivo do `when`. Sem `model`, é o do agente; um modelo
# de outro provedor vira o equivalente pelo tier (opus → top, sonnet → mid, haiku → fast).

[[effort.variants.planner]]
effort = "medium"
when = "ajuste do plano que o usuário pediu na aprovação"

[[effort.variants.explorer]]
model = "sonnet"
effort = "medium"
when = "refazer uma vez quando o resultado do padrão não fez sentido (diga o motivo)"

[[effort.variants.explorer]]
model = "sonnet"
effort = "high"
when = "levantamento: o mapa do fluxo de ponta a ponta é a entrega"

[[effort.variants.coder]]
effort = "medium"
when = "correção pequena (achado mantido, teste que falhou, ajuste do usuário) ou ajuste temporário de teste"

[[effort.variants.reviewer]]
effort = "medium"
when = "re-revisão só das correções"

[[effort.variants.reviewer]]
effort = "low"
when = "re-revisão de uma correção trivial (texto, uma linha, renomear)"

[[effort.variants.qa]]
effort = "high"
when = "refazer uma vez quando o resultado não fez sentido (diga o motivo)"
