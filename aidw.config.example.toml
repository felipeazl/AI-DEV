# Exemplo de configuração do AiDW (genérico, sem contexto). Cada máquina tem o seu aidw.config.toml, que
# NÃO é versionado: o `setup` cria pelo wizard (ou copie este arquivo e ajuste).
# Pode editar à mão; depois rode `python aidw.py apply` e abra um chat novo.
# Atenção: `configure` reescreve este arquivo (comentários próprios são perdidos).

[provider]
# "claude" = tudo no Claude Code · "codex" = tudo no Codex CLI. Um provedor por vez.
name = "claude"

[delegation]
# "native"   = subagentes nativos do provedor (Claude: ferramenta Agent; Codex: spawn_agent)
# "headless" = um processo do CLI por tarefa, via `python aidw.py delegate`
mode = "native"

[workspace]
# Pastas dos seus projetos. Liberadas para o orquestrador e todos os agentes.
project_dirs = []

[worktree]
# Onde ficam os worktrees das demandas (<raiz>/<id>/<repo>). Curta e fora de qualquer repositório.
root = "C:/wt"

[mcp]
# Servidores de config/mcp.toml registrados no projeto. O orquestrador decide quando usar.
enabled = ["playwright", "chrome-devtools", "figma", "context7"]

[context]
# Pacote de regras de trabalho em contexts/<nome>/ ("" = nenhum).
active = ""

[policies]
# deny = bloqueado sempre · ask = sempre pede confirmação (vence qualquer allow).
# Sintaxe do Claude Code; no Codex, as regras de comando viram .codex/rules/aidw.rules.
deny = [
    "Bash(git push --force *)",
    "Bash(git push -f *)",
    "Bash(git reset --hard *)",
    "Bash(git clean -f *)",
    "PowerShell(git push --force *)",
    "PowerShell(git push -f *)",
    "PowerShell(git reset --hard *)",
    "PowerShell(git clean -f *)",
    "Read(**/.env)",
    "Read(**/.env.*)",
]
ask = [
]

# [agents.<papel>] — o papel é fixo. Opcionais:
#   name   nome do agente (aceita acento e espaço; sem ele, vale o padrão comentado)
#   model  chave de config/models.toml do provedor; sem ele, vale o tier padrão do papel
#          (Opus/top no planejador, codificador e revisor; Sonnet/mid na api, bugs e segurança;
#           Haiku/fast no explorador e no documentador). Modelo de outro provedor é ignorado com aviso.
#   effort effort padrão do agente; o orquestrador escolhe o de cada tarefa (routing.toml).

[agents.orchestrator]
# name = "orquestrador"
enabled = true
effort = "high"
skills = ["to-spec", "verificar-premissa", "preparar-worktree"]

# Para desligar um agente: enabled = false (o orquestrador faz a etapa dele ou a pula).
[agents.planner]
# name = "planejador"
# Plano, correção do plano e tickets num contexto novo. Opus: o plano decide o custo das etapas seguintes.
enabled = true
effort = "medium"
skills = ["to-spec", "verificar-premissa"]
preload = ["to-spec"]

[agents.explorer]
# name = "explorador"
# Leitura de código com arquivo:linha. Haiku (sem effort); Sonnet nas demandas complexa e crítica (routing.toml).
enabled = true
effort = "low"
skills = []

[agents.coder]
# name = "codificador"
enabled = true
effort = "medium"
skills = ["preparar-worktree"]

[agents.reviewer]
# name = "revisor"
# Opus (medium no padrao, high em complexa/crítica); Sonnet high em trivial/simples (routing.toml).
model = "opus"
enabled = true
effort = "medium"
skills = ["code-review", "verificar-premissa"]
preload = ["code-review"]

[agents.api-db]
# name = "api"
enabled = true
effort = "medium"
skills = ["database-safe"]

[agents.qa]
# name = "qa"
enabled = false
effort = "medium"
skills = []

[agents.documenter]
# name = "documentador"
enabled = true
effort = "medium"
skills = []

[agents.bug-hunter]
# name = "bugs"
enabled = true
effort = "high"
skills = ["bug-hunt", "verificar-premissa"]
preload = ["bug-hunt"]

[agents.security]
# name = "seguranca"
enabled = true
effort = "high"
skills = ["security-audit", "verificar-premissa"]
preload = ["security-audit"]
