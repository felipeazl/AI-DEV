# Exemplo de configuração do AiDW (genérico, sem contexto). Cada máquina tem o seu aidw.config.toml, que
# NÃO é versionado: o `setup` cria pelo wizard (ou copie este arquivo e ajuste).
# Pode editar à mão; depois rode `python aidw.py apply` e abra um chat novo.
# Atenção: `configure` reescreve este arquivo (comentários próprios são perdidos).

[provider]
# "claude" = tudo no Claude Code · "codex" = tudo no Codex CLI. Um provedor por vez.
name = "claude"

[delegation]
# "native"   = subagentes nativos do provedor (Claude: ferramenta Agent; Codex: spawn_agent)
# "headless" = um processo do CLI por tarefa, via `python aidw.py delegate`
mode = "native"

[workspace]
# Pastas dos seus projetos. Liberadas para o orquestrador e todos os agentes.
project_dirs = []

[worktree]
# Onde ficam os worktrees das demandas (<raiz>/<id>/<repo>). Curta e fora de qualquer repositório.
root = "C:/wt"

[mcp]
# Servidores de config/mcp.toml registrados no projeto. O orquestrador decide quando usar.
enabled = ["playwright", "chrome-devtools", "figma", "context7"]

[context]
# Pacote de regras de trabalho em contexts/<nome>/ ("" = nenhum).
active = ""

[policies]
# deny = bloqueado sempre · ask = sempre pede confirmação (vence qualquer allow).
# Sintaxe do Claude Code; no Codex, as regras de comando viram .codex/rules/aidw.rules.
deny = [
    "Bash(git push --force *)",
    "Bash(git push -f *)",
    "Bash(git reset --hard *)",
    "Bash(git clean -f *)",
    "PowerShell(git push --force *)",
    "PowerShell(git push -f *)",
    "PowerShell(git reset --hard *)",
    "PowerShell(git clean -f *)",
    "Read(**/.env)",
    "Read(**/.env.*)",
]
ask = [
]

# [agents.<papel>] — o papel é fixo. Opcionais:
#   name   nome do agente (aceita acento e espaço; sem ele, vale o padrão comentado)
#   model  chave de config/models.toml do provedor; sem ele, vale o tier padrão do papel
#          (Opus/top no orquestrador; Sonnet/mid no planejador, codificador, revisor e qa;
#           Haiku/fast no explorador e no documentador). Modelo de outro provedor vira o equivalente.
#   effort effort padrão do agente; as exceções permitidas ficam em [effort.variants] do routing.toml.
# Fluxo v3 (2026-10-23): sem níveis de demanda; os agentes api, bugs e segurança saíram (o explorador e o qa
# fazem as consultas do api; o revisor revisa qualidade, bugs e segurança numa passada).

[agents.orchestrator]
# name = "orquestrador"
# O chat aberto; o effort é a recomendação para o chat (o modelo é o que você escolhe nele).
enabled = true
effort = "medium"
skills = ["to-spec", "verificar-premissa", "preparar-worktree"]

# Para desligar um agente: enabled = false (o orquestrador faz a etapa dele ou a pula).
[agents.planner]
# name = "planejador"
# O plano SDD (simples e autossuficiente para o codificador) e o ajuste dele, num contexto novo.
model = "sonnet"
enabled = true
effort = "high"
skills = ["to-spec", "verificar-premissa"]
preload = ["to-spec"]

[agents.explorer]
# name = "explorador"
# Código com arquivo:linha, contratos, ids e SELECT pelo validador. Haiku (sem effort); Sonnet só nas exceções.
model = "haiku"
enabled = true
effort = "low"
skills = ["database-safe"]

[agents.coder]
# name = "codificador"
model = "sonnet"
enabled = true
effort = "high"
skills = ["preparar-worktree"]

[agents.reviewer]
# name = "revisor"
# Qualidade, bugs e segurança numa passada; medium/low só na re-revisão das correções.
model = "sonnet"
enabled = true
effort = "high"
skills = ["code-review", "verificar-premissa"]
preload = ["code-review"]

[agents.qa]
# name = "qa"
# Roteiro e massa em paralelo com o codificador; depois da sua revisão, o teste (API e navegador sozinho, o resto
# com você).
model = "sonnet"
enabled = true
effort = "medium"
skills = ["database-safe"]

[agents.documenter]
# name = "documentador"
# As Tasks no board e o texto da PR.
model = "haiku"
enabled = true
effort = "medium"
skills = []
