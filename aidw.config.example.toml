# Example AiDW configuration (generic, no context). Each machine has its own aidw.config.toml, which is
# NOT versioned: `setup` creates it through the wizard (or copy this file and adjust it).
# You may edit it by hand; then run `python aidw.py apply` and open a new chat.
# Note: `configure` rewrites this file (your own comments are lost).

[provider]
# "claude" = everything on Claude Code · "codex" = everything on Codex CLI. One provider at a time.
name = "claude"

# [ui]
# language: BCP-47 tag (e.g. "en", "pt-BR"); default "en". The language the orchestrator chat uses with the user.
# A context's own `language` (top level of contexts/<name>/context.toml) inherits this one when absent; it is the
# language of the context's content and of the demand artifacts' content. File names are always English.
# language = "en"

[delegation]
# "native"   = the provider's native subagents (Claude: Agent tool; Codex: spawn_agent)
# "headless" = one CLI process per task, via `python aidw.py delegate`
mode = "native"

[workspace]
# Your project folders. Allowed for the orchestrator and every agent.
project_dirs = []

[worktree]
# Where the demands' worktrees live (<root>/<id>/<repo>). Short and outside any repository.
root = "C:/wt"

[mcp]
# Servers from config/mcp.toml registered in the project. The orchestrator decides when to use them.
enabled = ["playwright", "chrome-devtools", "figma", "context7"]

[context]
# Package of working rules in contexts/<name>/ ("" = none).
active = ""

[policies]
# deny = always blocked · ask = always asks for confirmation (wins over any allow).
# Claude Code syntax; on Codex, the command rules become .codex/rules/aidw.rules.
deny = [
    "Bash(git push --force *)",
    "Bash(git push -f *)",
    "Bash(git reset --hard *)",
    "Bash(git clean -f *)",
    "PowerShell(git push --force *)",
    "PowerShell(git push -f *)",
    "PowerShell(git reset --hard *)",
    "PowerShell(git clean -f *)",
    "Read(**/.env)",
    "Read(**/.env.*)",
]
ask = [
]

# [agents.<role>] — the role is fixed. Optional:
#   name   the agent's name (accents and spaces allowed; without it, the commented default applies)
#   model  key from config/models.toml for the provider; without it, the role's default tier applies
#          (Opus/top for the orchestrator; Sonnet/mid for the planner, coder, reviewer and qa;
#           Haiku/fast for the explorer and the documenter). A model from another provider becomes the equivalent.
#   effort the agent's default effort; the allowed exceptions live in [effort.variants] of routing.toml.
# Flow v3 (2026-10-23): no demand levels; the api, bugs and security agents were removed (the explorer and the qa
# make the api's queries; the reviewer reviews quality, bugs and security in one pass).

[agents.orchestrator]
# name = "orchestrator"
# The open chat; the effort is the recommendation for the chat (the model is the one you pick in it).
enabled = true
effort = "medium"
skills = ["to-spec", "verify-premise", "prepare-worktree"]

# To turn an agent off: enabled = false (the orchestrator does its step or skips it).
[agents.planner]
# name = "planner"
# The SDD plan (simple and self-contained for the coder) and its adjustment, in a fresh context.
model = "sonnet"
enabled = true
effort = "high"
skills = ["to-spec", "verify-premise"]
preload = ["to-spec"]

[agents.explorer]
# name = "explorer"
# Code with file:line, contracts, ids and SELECT through the validator. Haiku (no effort); Sonnet only in the exceptions.
model = "haiku"
enabled = true
effort = "low"
skills = ["database-safe"]

[agents.coder]
# name = "coder"
model = "sonnet"
enabled = true
effort = "high"
skills = ["prepare-worktree"]

[agents.reviewer]
# name = "reviewer"
# Quality, bugs and security in one pass; medium/low only when re-reviewing the fixes.
model = "sonnet"
enabled = true
effort = "high"
skills = ["code-review", "verify-premise"]
preload = ["code-review"]

[agents.qa]
# name = "qa"
# Test script and test data in parallel with the coder; after your review, the test (API and browser on its own,
# the rest with you).
model = "sonnet"
enabled = true
effort = "medium"
skills = ["database-safe"]

[agents.documenter]
# name = "documenter"
# The Tasks on the board and the PR text.
model = "haiku"
enabled = true
effort = "medium"
skills = []
