name: hotfix
description: Correção urgente; escopo mínimo, mas review e aprovação humana continuam obrigatórios.
steps:
  - id: reproduce
    agent: coder
  - id: implement
    agent: coder
  - id: test            # qa (modo test; ajustes temporários via codificador); desabilitado: `validation`
    agent: qa
  - id: prepare_review
    agent: orchestrator
  - id: review
    agent: reviewer
    skill: code-review
  - id: bug_hunt        # opcional — o orquestrador decide (ORCHESTRATOR.md, specialist passes);
    agent: bug-hunter   # roda em paralelo com a 1ª rodada de revisão
    skill: bug-hunt
    optional: true
  - id: security_audit  # opcional — idem
    agent: security
    skill: security-audit
    optional: true
  - id: manual_test     # roteiro manual do qa com o usuário, depois da revisão aprovada (só se houver)
    agent: orchestrator
  - id: final_review
    agent: orchestrator
gates:
  - before: deploy
    require: human_approval
