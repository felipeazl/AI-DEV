name: hotfix
description: Correção urgente; escopo mínimo, mas review e aprovação humana continuam obrigatórios.
steps:
  - id: reproduce
    agent: coder
    skill: debug
  - id: implement
    agent: coder
    skill: implement-ticket
  - id: test            # qa quando habilitado; senão o bloco `validation` do codificador
    agent: qa
    skill: testing
  - id: prepare_review
    agent: orchestrator
  - id: review
    agent: reviewer
    skill: code-review
  - id: bug_hunt        # opcional — o orquestrador decide (ORCHESTRATOR.md, specialist passes);
    agent: bug-hunter   # roda em paralelo com a 1ª rodada de revisão
    skill: bug-hunt
    optional: true
  - id: security_audit  # opcional — idem
    agent: security
    skill: security-audit
    optional: true
  - id: final_review
    agent: orchestrator
gates:
  - before: deploy
    require: human_approval
