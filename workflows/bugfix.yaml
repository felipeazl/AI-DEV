name: bugfix
description: Correção de bug com reprodução, teste de regressão e review.
steps:
  - id: spec
    agent: orchestrator
    skill: to-spec
  - id: tickets
    agent: orchestrator
    skill: to-tickets
  - id: reproduce
    agent: coder
    skill: debug
  - id: implement
    agent: coder
    skill: implement-ticket
    for_each: ticket
  - id: test            # qa quando habilitado; senão o bloco `validation` do codificador
    agent: qa
    skill: testing
  - id: prepare_review
    agent: orchestrator
  - id: review
    agent: reviewer
    skill: code-review
  - id: docs            # só se o comportamento documentado mudou
    agent: documenter
    skill: documentation
  - id: final_review
    agent: orchestrator
gates:
  - before: merge
    require: human_approval
