name: bugfix
description: Correção de bug com reprodução, teste de regressão e review.
steps:
  - id: spec
    agent: orchestrator
    skill: to-spec
  - id: plan_review     # padrao ou acima; ⇄ orquestrador corrige o plano (PLAN_FIX)
    agent: reviewer
    skill: code-review
  - id: tickets
    agent: orchestrator
    skill: to-spec
  - id: reproduce       # causa-raiz não óbvia: bugs (modo root-cause) antes de fechar o plano
    agent: coder
  - id: implement
    agent: coder
    for_each: ticket
  - id: test            # qa quando habilitado; senão o bloco `validation` do codificador
    agent: qa
  - id: prepare_review
    agent: orchestrator
  - id: review
    agent: reviewer
    skill: code-review
  - id: bug_hunt        # opcional — o orquestrador decide (ORCHESTRATOR.md, specialist passes);
    agent: bug-hunter   # roda em paralelo com a 1ª rodada de revisão
    skill: bug-hunt
    optional: true
  - id: security_audit  # opcional — idem
    agent: security
    skill: security-audit
    optional: true
  - id: docs            # só se o comportamento documentado mudou
    agent: documenter
  - id: final_review
    agent: orchestrator
gates:
  - before: merge
    require: human_approval
