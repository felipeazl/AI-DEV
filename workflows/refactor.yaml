name: refactor
description: Refatoração sem mudança de comportamento; testes antes e depois.
steps:
  - id: spec
    agent: orchestrator
    skill: to-spec
  - id: plan_review     # padrao ou acima; ⇄ orquestrador corrige o plano (PLAN_FIX)
    agent: reviewer
    skill: code-review
  - id: tickets
    agent: orchestrator
    skill: to-spec
  - id: baseline        # build/testes da base; com qa desabilitado, o codificador roda
    agent: qa
  - id: implement
    agent: coder
    for_each: ticket
  - id: test
    agent: qa
  - id: prepare_review
    agent: orchestrator
  - id: review
    agent: reviewer
    skill: code-review
  - id: bug_hunt        # opcional — o orquestrador decide (ORCHESTRATOR.md, specialist passes);
    agent: bug-hunter   # roda em paralelo com a 1ª rodada de revisão
    skill: bug-hunt
    optional: true
  - id: security_audit  # opcional — idem
    agent: security
    skill: security-audit
    optional: true
  - id: docs
    agent: documenter
  - id: final_review
    agent: orchestrator
gates:
  - before: merge
    require: human_approval
