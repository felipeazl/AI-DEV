name: refactor
description: Refatoração sem mudança de comportamento; testes antes e depois.
steps:
  - id: spec          # explorador antes, quando o código ainda não é conhecido
    agent: planner
    skill: to-spec
  - id: test_plan       # qa (modo plan): plano-testes-<id>.md; qa desabilitado, pula
    agent: qa
  - id: plan_review     # padrao ou acima; ⇄ planejador corrige o plano (PLAN_FIX)
    agent: reviewer
    skill: code-review
  - id: tickets
    agent: planner
    skill: to-spec
  - id: baseline        # build/testes da base; com qa desabilitado, o codificador roda
    agent: qa
  - id: implement
    agent: coder
    for_each: ticket
  - id: test
    agent: qa
  - id: prepare_review
    agent: orchestrator
  - id: review
    agent: reviewer
    skill: code-review
  - id: bug_hunt        # opcional — o orquestrador decide (ORCHESTRATOR.md, specialist passes);
    agent: bug-hunter   # roda em paralelo com a 1ª rodada de revisão
    skill: bug-hunt
    optional: true
  - id: security_audit  # opcional — idem
    agent: security
    skill: security-audit
    optional: true
  - id: manual_test     # roteiro manual do qa com o usuário, depois da revisão aprovada (só se houver)
    agent: orchestrator
  - id: docs
    agent: documenter
  - id: final_review
    agent: orchestrator
gates:
  - before: merge
    require: human_approval
