name: pr-review
description: Revisão da PR de outra pessoa; sem plano nem correção (quem corrige é o autor). O usuário escolhe o que é publicado na PR.
steps:
  - id: understand      # resumo-<id>.md: card, critérios e, por PR, autor, descrição, destino e o que já foi comentado
    agent: orchestrator
  - id: prepare_pr      # `aidw.py worktree create --pr <n>` por PR (só leitura, PR mesclada no destino) e o build nele
    agent: orchestrator
  - id: review          # revisor no modo PR (qualidade, bugs e segurança): achados com o rascunho do comentário e o voto
    agent: reviewer
    skill: code-review
  - id: final_review    # o usuário escolhe os comentários e o voto; publicar é ação travada
    agent: orchestrator
gates:
  - before: publish
    require: human_approval
