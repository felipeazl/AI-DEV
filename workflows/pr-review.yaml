name: pr-review
description: Review of someone else's PR; no plan or fix (the author fixes). The user chooses what is published on the PR.
steps:
  - id: understand      # summary-<id>.md: card, criteria and, per PR, author, description, target and what was already commented
    agent: orchestrator
  - id: prepare_pr      # `aidw.py worktree create --pr <n>` per PR (read only, PR merged into the target) and the build in it
    agent: orchestrator
  - id: review          # reviewer in PR mode (quality, bugs and security): findings with the draft comment
    agent: reviewer
    skill: code-review
  - id: final_review    # the user chooses the comments and whether AiDW approves the PR (manual, yes, no); publishing is a locked action
    agent: orchestrator
gates:
  - before: publish
    require: human_approval
