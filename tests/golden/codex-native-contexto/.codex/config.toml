# Generated by aidw.py apply — project config for Codex (applies when the project is
# trusted: setup offers to mark it). `python aidw.py chat` passes the same values as flags.

model = "gpt-6-sol"
model_reasoning_effort = "medium"
project_doc_max_bytes = 98304
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true
writable_roots = ["C:\\pasta-de-teste-inexistente", "<TMP>\\wt"]

# GIT_CONFIG_*: safe.directory for the Windows sandbox (see codex_git_env).
[shell_environment_policy.set]
MCP_TIMEOUT = "60000"
GIT_CONFIG_COUNT = "4"
GIT_CONFIG_KEY_0 = "safe.directory"
GIT_CONFIG_VALUE_0 = "<ROOT>/*"
GIT_CONFIG_KEY_1 = "safe.directory"
GIT_CONFIG_VALUE_1 = "C:/pasta-de-teste-inexistente/*"
GIT_CONFIG_KEY_2 = "safe.directory"
GIT_CONFIG_VALUE_2 = "<TMP>/wt/*"
GIT_CONFIG_KEY_3 = "safe.directory"
GIT_CONFIG_VALUE_3 = "<ROOT>"

# Native subagents: the multi-agent v2 spawn_agent accepts model and effort per call.
[features]
multi_agent_v2 = true

[agents]
max_concurrent_threads_per_session = 4

[mcp_servers.playwright]
command = "cmd"
args = ["/c", "npx", "-y", "@playwright/mcp@latest"]

[mcp_servers.chrome-devtools]
command = "cmd"
args = ["/c", "npx", "-y", "chrome-devtools-mcp@latest"]

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.context7]
command = "cmd"
args = ["/c", "npx", "-y", "@upstash/context7-mcp"]
