# Catalog of MCP servers that AiDW registers in the project scope (.mcp.json).
#
# Which ones are active: aidw.config.toml → [mcp].enabled.
# After changing this file or the list, run `python aidw.py apply` (and `install`) and open a new chat.
#
# Fields:
#   name        human-readable name
#   type        stdio (local process) | http (remote server)
#   command     command + args (stdio)       · url (http)
#   env         variables passed to the process (stdio), optional
#   auth        "oauth" = authenticate once in Claude Code: /mcp → <server> → Authenticate
#   allow       true = tools allowed without a permission prompt
#   agents      roles that may use it ([] = all)
#   use_when    when to use it — goes into the orchestrator's and the agents' instructions
#   triggers    signals in the task that call for it: the orchestrator only names the server in a task
#               when a trigger clearly applies.
#
# Sources: github.com/microsoft/playwright-mcp · github.com/ChromeDevTools/chrome-devtools-mcp
#          developers.figma.com/docs/figma-mcp-server · github.com/upstash/context7

[servers.playwright]
name = "Playwright"
type = "stdio"
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
allow = false
agents = ["coder", "qa", "reviewer"]
use_when = "Exercise the application in the browser end to end: navigate, fill in forms, click, validate flows and UI acceptance criteria, reproduce screen bugs."
triggers = [
    "E2E / end-to-end test of a screen or flow",
    "validate a UI acceptance criterion",
    "reproduce an interaction bug (click, form, navigation)",
]

[servers.chrome-devtools]
name = "Chrome DevTools"
type = "stdio"
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest"]
allow = false
agents = ["coder", "qa"]
use_when = "Debug the application in a real Chrome: console, network requests, performance (LCP, traces), DOM and CSS, JavaScript errors."
triggers = [
    "error in the browser console",
    "network request failing or slow in the front end",
    "slow page / performance problem",
    "layout or CSS problem to inspect",
]

[servers.figma]
name = "Figma"
type = "http"
url = "https://mcp.figma.com/mcp"
auth = "oauth"
allow = true
agents = ["coder", "reviewer", "documenter"]
use_when = "Read the design in Figma (frames, components, variables, spacing, texts) to implement or check a screen faithful to the layout."
triggers = [
    "the demand creates or changes a screen/layout (a Figma link is only a hint, not enough)",
    "implement or adjust a screen from the layout",
    "check the screen's fidelity to the design",
]

[servers.context7]
name = "Context7"
type = "stdio"
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
allow = true
agents = []
use_when = "Look up current documentation and examples of a library/framework, in the version the project uses, before using an API you are unsure about."
triggers = [
    "using a library or framework API without being sure of its signature",
    "doubt about a version, breaking change or migration",
    "configuring an external tool or package",
]
