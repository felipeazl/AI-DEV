# Catálogo de modelos disponíveis para os agentes.
#
# O wizard (`python aidev.py configure`) oferece estes modelos como opção.
# Para adicionar um modelo, crie uma nova tabela [models.<chave>].
#
# Campos:
#   name         nome legível
#   provider     anthropic | openai | other
#   model_id     ID completo — usado no chat principal (orquestrador)
#   alias        apelido usado no frontmatter dos subagentes: opus | sonnet | haiku | fable
#   effort       low | medium | high | xhigh | max — effort do chat (orquestrador) ou do
#                subagente (campo `effort` do frontmatter; não dá para trocar por chamada, por
#                isso cada nível de demanda com effort diferente gera uma variante do agente)
#   min_claude_code  versão mínima do CLI `claude` para usar o model_id no chat
#   router_only  true = só pode ser usado como camada de decisão (JEV), não como agente
#
# Hoje tudo roda com o login do Claude Code (sem API key), então só provider "anthropic"
# pode ser usado. Os outros ficam catalogados para quando houver orquestrador próprio.

[models.opus-high]
name = "Claude Opus 5.5 (High)"
provider = "anthropic"
model_id = "claude-opus-5-5"
alias = "opus"
effort = "high"
min_claude_code = "2.1.280"

[models.opus-low]
name = "Claude Opus 5.5 (Low)"
provider = "anthropic"
model_id = "claude-opus-5-5"
alias = "opus"
effort = "low"
min_claude_code = "2.1.280"

[models.opus-medium]
name = "Claude Opus 5.5 (Medium)"
provider = "anthropic"
model_id = "claude-opus-5-5"
alias = "opus"
effort = "medium"
min_claude_code = "2.1.280"

[models.sonnet]
name = "Claude Sonnet 5"
provider = "anthropic"
model_id = "claude-sonnet-5"
alias = "sonnet"
effort = "high"

[models.sonnet-medium]
name = "Claude Sonnet 5 (Medium)"
provider = "anthropic"
model_id = "claude-sonnet-5"
alias = "sonnet"
effort = "medium"

[models.sonnet-low]
name = "Claude Sonnet 5 (Low)"
provider = "anthropic"
model_id = "claude-sonnet-5"
alias = "sonnet"
effort = "low"

[models.haiku]
name = "Claude Haiku 4.5"
provider = "anthropic"
model_id = "claude-haiku-4-5-20251001"
alias = "haiku"

# --- OpenAI: só como orquestrador no Codex CLI ([codex] do aidev.config.toml) ------------
# IDs conferidos em developers.openai.com/api/docs/models (2026-09-25). No Codex com conta ChatGPT
# só valem os modelos liberados para o plano (o `doctor` confere em ~/.codex/models_cache.json). Os agentes continuam
# Claude: o Codex delega com `python aidev.py delegate`.
[models.gpt-sol]
name = "GPT-5.6 Sol"
provider = "openai"
model_id = "gpt-5.6-sol"

[models.gpt-terra]
name = "GPT-5.6 Terra"
provider = "openai"
model_id = "gpt-5.6-terra"

[models.gpt-luna]
name = "GPT-5.6 Luna"
provider = "openai"
model_id = "gpt-5.6-luna"

[models.gpt-6-luna]
name = "GPT-6 Luna"
provider = "openai"
model_id = "gpt-6-luna"

[models.gpt-6-sol]
name = "GPT-6 Sol"
provider = "openai"
model_id = "gpt-6-sol"

# TODO: definir provider e ID do JEV antes de habilitá-lo.
[models.jev]
name = "JEV"
provider = "other"
model_id = "jev"
router_only = true
