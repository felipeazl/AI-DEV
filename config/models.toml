# AiDW model catalog.
#
# AiDW runs with ONE provider per installation — every agent is Claude or every agent is Codex
# ([provider].name in aidw.config.toml). Each model belongs to one provider.
#
# Fields:
#   name       human-readable name
#   provider   claude | codex
#   model_id   ID passed to the CLI (`claude --model` / `codex -m`). On Claude it is the alias (opus, sonnet…),
#              which Claude Code resolves to the newest model of the family it knows; on Codex it is the
#              exact ID, because Codex has no aliases.
#   label      how the model shows in the header, the tables and the Runtime: the family, no version
#   tiers      top | mid | fast — the wizard uses the tier to pick each agent's default
#              (Opus/Sonnet/Haiku on Claude; the equivalents on Codex). Within a tier, the first model
#              in this file that is available to the account wins.
#   efforts    accepted efforts; empty = the model takes no effort (delegate does not pass --effort)
#   min_cli    minimum CLI version for the model (checked by `doctor`)
#   alias      (Claude) alias in the native subagents' frontmatter: opus | sonnet | haiku | fable
#
# Effort does not belong to the model: each agent has a default effort in aidw.config.toml and the
# orchestrator picks the effort of each task (orchestrator/config/routing.toml, [effort]).

# --- Claude (Claude Code, subscription login) ------------------------------------------------

[models.opus]
name = "Claude Opus"
label = "claude-opus"
provider = "claude"
model_id = "opus"
alias = "opus"
tiers = ["top"]
efforts = ["low", "medium", "high", "xhigh", "max"]
min_cli = "2.1.280"

[models.sonnet]
name = "Claude Sonnet"
label = "claude-sonnet"
provider = "claude"
model_id = "sonnet"
alias = "sonnet"
tiers = ["mid"]
efforts = ["low", "medium", "high", "xhigh", "max"]

[models.haiku]
name = "Claude Haiku"
label = "claude-haiku"
provider = "claude"
model_id = "haiku"
alias = "haiku"
tiers = ["fast"]
efforts = []

[models.fable]
name = "Claude Fable"
label = "claude-fable"
provider = "claude"
model_id = "fable"
alias = "fable"
tiers = []
efforts = ["low", "medium", "high", "xhigh", "max"]

# --- Codex (Codex CLI, ChatGPT account login) ------------------------------------------------
# Only the models enabled for the account's plan count; `doctor` checks them in
# ~/.codex/models_cache.json. On 2026-09-25 the account had gpt-6-luna, gpt-5.6-terra,
# gpt-5.6-luna and gpt-5.5 — gpt-6-sol was not enabled, so the top tier falls back to gpt-6-luna.
# Three steps, as on Claude: top (Opus) gpt-6-sol/gpt-6-luna, mid (Sonnet) gpt-5.6-terra, fast (Haiku)
# gpt-5.6-luna (decision, 2026-09-30).

[models.gpt-6-sol]
name = "GPT Sol"
label = "gpt-sol"
provider = "codex"
model_id = "gpt-6-sol"
tiers = ["top"]
efforts = ["low", "medium", "high", "xhigh", "max"]

[models.gpt-6-luna]
name = "GPT Luna"
label = "gpt-luna"
provider = "codex"
model_id = "gpt-6-luna"
tiers = ["top"]
efforts = ["low", "medium", "high", "xhigh", "max"]

[models.gpt-5-6-terra]
name = "GPT Terra"
label = "gpt-terra"
provider = "codex"
model_id = "gpt-5.6-terra"
tiers = ["mid"]
efforts = ["low", "medium", "high", "xhigh", "max"]

[models.gpt-5-6-luna]
name = "GPT Luna"
label = "gpt-luna"
provider = "codex"
model_id = "gpt-5.6-luna"
tiers = ["fast"]
efforts = ["low", "medium", "high", "xhigh", "max"]
