# Catálogo de modelos do AiDW.
#
# O AiDW roda com UM provedor por instalação — todos os agentes são Claude ou todos são Codex
# ([provider].name no aidw.config.toml). Cada modelo pertence a um provedor.
#
# Campos:
#   name       nome legível
#   provider   claude | codex
#   model_id   ID passado ao CLI (`claude --model` / `codex -m`). No Claude é o apelido (opus, sonnet…),
#              que o Claude Code resolve para o modelo mais novo da família que ele conhece; no Codex
#              é o ID exato, porque o Codex não tem apelido.
#   label      como o modelo aparece no cabeçalho, nas tabelas e no Runtime: a família, sem versão
#   tiers      top | mid | fast — o wizard usa o tier para escolher o padrão de cada agente
#              (Opus/Sonnet/Haiku no Claude; os equivalentes no Codex). Em cada tier vale o
#              primeiro modelo do arquivo que estiver disponível para a conta.
#   efforts    efforts aceitos; vazio = o modelo não aceita effort (o delegate não passa --effort)
#   min_cli    versão mínima do CLI para o modelo (o `doctor` confere)
#   alias      (Claude) apelido do frontmatter dos subagentes nativos: opus | sonnet | haiku | fable
#
# O effort não pertence ao modelo: cada agente tem um effort padrão no aidw.config.toml e o
# orquestrador escolhe o effort de cada tarefa (orchestrator/config/routing.toml, [effort]).

# --- Claude (Claude Code, login da assinatura) -----------------------------------------------

[models.opus]
name = "Claude Opus"
label = "claude-opus"
provider = "claude"
model_id = "opus"
alias = "opus"
tiers = ["top"]
efforts = ["low", "medium", "high", "xhigh", "max"]
min_cli = "2.1.280"

[models.sonnet]
name = "Claude Sonnet"
label = "claude-sonnet"
provider = "claude"
model_id = "sonnet"
alias = "sonnet"
tiers = ["mid"]
efforts = ["low", "medium", "high", "xhigh", "max"]

[models.haiku]
name = "Claude Haiku"
label = "claude-haiku"
provider = "claude"
model_id = "haiku"
alias = "haiku"
tiers = ["fast"]
efforts = []

[models.fable]
name = "Claude Fable"
label = "claude-fable"
provider = "claude"
model_id = "fable"
alias = "fable"
tiers = []
efforts = ["low", "medium", "high", "xhigh", "max"]

# --- Codex (Codex CLI, login da conta ChatGPT) -----------------------------------------------
# Só valem os modelos liberados para o plano da conta; o `doctor` confere em
# ~/.codex/models_cache.json. Em 2026-09-25 a conta tinha gpt-6-luna, gpt-5.6-terra,
# gpt-5.6-luna e gpt-5.5 — o gpt-6-sol não estava liberado, então o tier top cai no gpt-6-luna.
# Três degraus, como no Claude: top (Opus) gpt-6-sol/gpt-6-luna, mid (Sonnet) gpt-5.6-terra, fast (Haiku)
# gpt-5.6-luna (Felipe, 2026-09-30).

[models.gpt-6-sol]
name = "GPT Sol"
label = "gpt-sol"
provider = "codex"
model_id = "gpt-6-sol"
tiers = ["top"]
efforts = ["low", "medium", "high", "xhigh", "max"]

[models.gpt-6-luna]
name = "GPT Luna"
label = "gpt-luna"
provider = "codex"
model_id = "gpt-6-luna"
tiers = ["top"]
efforts = ["low", "medium", "high", "xhigh", "max"]

[models.gpt-5-6-terra]
name = "GPT Terra"
label = "gpt-terra"
provider = "codex"
model_id = "gpt-5.6-terra"
tiers = ["mid"]
efforts = ["low", "medium", "high", "xhigh", "max"]

[models.gpt-5-6-luna]
name = "GPT Luna"
label = "gpt-luna"
provider = "codex"
model_id = "gpt-5.6-luna"
tiers = ["fast"]
efforts = ["low", "medium", "high", "xhigh", "max"]
